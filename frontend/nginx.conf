server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively. They are content-hashed.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: all unmatched routes hit index.html so the
    # TanStack Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
