# Full local stack via Docker.
#
# One-shot start (everything in containers):
#   cp .env.example .env        # generates the dev secrets compose needs
#   docker compose up -d --build
#
# Then open:
#   - Frontend (AgroBuy + chat copilot): http://localhost:8080
#   - Backend API + OpenAPI docs:        http://localhost:8000/docs
#   - Postgres (host port):              localhost:5436
#   - Redis (host port):                 localhost:6379
#
# Services:
#   - postgres   PostgreSQL 16 with pgvector
#   - redis      Redis 7 (ARQ queue + cache + circuit breaker)
#   - backend    FastAPI app exposing /api/v1/procurement and /api/v1/procurement/chat
#   - frontend   Vite-built SPA served by nginx with SPA fallback
#
# Optional profiles:
#   - oracle     Oracle XE 23ai for APEX integration testing
#                docker compose --profile oracle up -d
#   - worker     ARQ async worker for webhooks/long jobs
#                docker compose --profile worker up -d
#
# Hybrid mode (DB + Redis in containers, app on host with hot reload):
#   docker compose up -d postgres redis
#   make dev-backend   # in one terminal
#   make dev-frontend  # in another

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: agropredict
    ports:
      - "5436:5432"
    volumes:
      - agropredict-ai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d agropredict"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - agropredict-ai-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  oracle-xe:
    image: gvenzl/oracle-xe:23-slim
    environment:
      ORACLE_PASSWORD: Oracle123
      ORACLE_DATABASE: APEXDB
      APP_USER: apex_user
      APP_USER_PASSWORD: apex_pass
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - agropredict-ai-oracle:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo exit | sqlplus -s apex_user/apex_pass@//localhost:1521/APEXDB"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles:
      - oracle

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: arq agropredict.worker.WorkerSettings
    environment:
      - BACKEND_DATABASE_URL=postgresql+psycopg://dev:dev@postgres:5432/agropredict
      - BACKEND_REDIS_URL=redis://redis:6379/0
      - BACKEND_ENCRYPTION_ACTIVE_KEY_ID=kek-dev-v1
      - BACKEND_ENCRYPTION_ACTIVE_WRAPPING_KEY=${BACKEND_ENCRYPTION_ACTIVE_WRAPPING_KEY:-}
      - BACKEND_WEBHOOK_SHARED_SECRET=${BACKEND_WEBHOOK_SHARED_SECRET:-}
      - BACKEND_WORKER_CONTROLLER_MODE=redis
      - BACKEND_WORKER_JOB_TIMEOUT_SECONDS=300
      - BACKEND_WORKER_QUEUE_NAME=ticket-runs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - worker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BACKEND_DATABASE_URL=postgresql+psycopg://dev:dev@postgres:5432/agropredict
      - BACKEND_REDIS_URL=redis://redis:6379/0
      - BACKEND_ENCRYPTION_ACTIVE_KEY_ID=kek-dev-v1
      - BACKEND_ENCRYPTION_ACTIVE_WRAPPING_KEY=${BACKEND_ENCRYPTION_ACTIVE_WRAPPING_KEY:?run \"cp .env.example .env\" or export this variable}
      - BACKEND_WEBHOOK_SHARED_SECRET=${BACKEND_WEBHOOK_SHARED_SECRET:?run \"cp .env.example .env\" or export this variable}
      - BACKEND_CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-https://api.openai.com/v1}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-gpt-4o-mini}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status<500 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser talks to the backend through the published host port.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

  seed:
    # One-shot job: loads the AgroBuy demo dataset (8 suppliers, 5 purchase
    # requests, 15 quotations, ~150 supplier history records) for tenant
    # 'tenant-coopagro'. Runs after the backend has applied its migrations.
    #
    # Usage:
    #   docker compose --profile seed up seed
    # or:
    #   docker compose run --rm seed
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - agropredict.procurement.fixtures.seed
    environment:
      - BACKEND_DATABASE_URL=postgresql+psycopg://dev:dev@postgres:5432/agropredict
      - BACKEND_REDIS_URL=redis://redis:6379/0
      - BACKEND_ENCRYPTION_ACTIVE_KEY_ID=kek-dev-v1
      - BACKEND_ENCRYPTION_ACTIVE_WRAPPING_KEY=${BACKEND_ENCRYPTION_ACTIVE_WRAPPING_KEY:?run \"cp .env.example .env\" or export this variable}
      - BACKEND_WEBHOOK_SHARED_SECRET=${BACKEND_WEBHOOK_SHARED_SECRET:?run \"cp .env.example .env\" or export this variable}
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    profiles:
      - seed

volumes:
  agropredict-ai-postgres:
  agropredict-ai-redis:
  agropredict-ai-oracle:
